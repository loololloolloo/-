<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fortnite 2D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Titan+One&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0b1120;
        width: 100%;
        height: 100%;
        user-select: none;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
<div id="dbg" style="position:fixed;bottom:0;left:0;z-index:99999;background:rgba(0,0,0,0.6);color:#0f0;font:11px monospace;pointer-events:none;padding:4px;"></div>
<div id="dbg2" style="position:fixed;bottom:22px;left:0;z-index:99999;background:rgba(0,0,0,0.6);color:#ff0;font:11px monospace;pointer-events:none;padding:4px;"></div>
<div id="dbg3" style="position:fixed;bottom:44px;left:0;z-index:99999;background:rgba(0,0,0,0.6);color:#0ff;font:11px monospace;pointer-events:none;padding:4px;"></div>
    <script>
      window.__errors = [];
      window.onerror = function (msg, src, line) {
        window.__errors.push(String(msg) + ' @ ' + src + ':' + line);
        var d = document.getElementById('errpanel');
        if (!d) {
          d = document.createElement('div');
          d.id = 'errpanel';
          d.style.cssText =
            'position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(180,20,20,0.85);color:#fff;font:12px monospace;padding:6px;max-height:40vh;overflow:auto;white-space:pre-wrap;';
          document.body.appendChild(d);
        }
        d.textContent = window.__errors.join('\n');
      };
      window.addEventListener('unhandledrejection', function (e) {
        window.__errors.push('PROMISE: ' + String(e.reason && e.reason.stack ? e.reason.stack : e.reason));
        var d = document.getElementById('errpanel');
        if (!d) {
          d = document.createElement('div');
          d.id = 'errpanel';
          d.style.cssText =
            'position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(140,40,180,0.85);color:#fff;font:12px monospace;padding:6px;max-height:40vh;overflow:auto;white-space:pre-wrap;';
          document.body.appendChild(d);
        }
        d.textContent = window.__errors.join('\n');
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
